name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Derle ve test et
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Yanki.slnx

      # netstandard2.1 ve net10.0 hedeflerinin ikisi de derlenir (ADR-004).
      - name: Build
        run: dotnet build Yanki.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Yanki.slnx -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
