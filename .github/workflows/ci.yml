name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Derle ve test et
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Yanki.slnx

      # netstandard2.1 ve net10.0 hedeflerinin ikisi de derlenir (ADR-004).
      - name: Build
        run: dotnet build Yanki.slnx -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Yanki.slnx -c Release --no-build \
            --logger "trx;LogFilePrefix=results" --logger "console;verbosity=normal" \
            --results-directory TestResults 2>&1 | tee test.log

      # Test kırılırsa hatanın özetini Actions ekranında annotation olarak göster.
      - name: Test hatasını özetle
        if: failure()
        shell: bash
        run: |
          grep -E "Failed |Error Message|error |Assert|Exception|Testhost|No test" test.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
